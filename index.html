<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бабки-менеджмент</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --paper: #EDE7DA;
    --paper-raised: #F5F1E7;
    --ink: #23262B;
    --ink-soft: #5B5C58;
    --navy: #2C3A4F;
    --brass: #A9793B;
    --brass-soft: #E4D2AC;
    --moss: #5F7A5A;
    --moss-soft: #DCE6D9;
    --clay: #A9573F;
    --clay-soft: #EEDAD1;
    --line: #D8D0BE;
    --debt-card-bg: #2C3A4F;
    --debt-card-fg: #EDE7DA;
  }

  html[data-theme="dark"]{
    --paper: #1C1914;
    --paper-raised: #262119;
    --ink: #EDE7DA;
    --ink-soft: #A79E8C;
    --navy: #8FA6C4;
    --brass: #D3A96A;
    --brass-soft: #423521;
    --moss: #8FB088;
    --moss-soft: #2A331F;
    --clay: #DA8C6C;
    --clay-soft: #3B241C;
    --line: #38321F;
  }
  html[data-theme="dark"] body{background:var(--paper);}

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    padding:20px 16px 40px;
    min-height:100vh;
  }

  h1,h2,h3{
    font-family:'Fraunces', serif;
    margin:0;
  }

  header.top{
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
  }
  header.top h1{
    font-size:26px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  header.top .date{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .theme-toggle{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:50%;
    width:38px;
    height:38px;
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
  }

  .summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
  }
  .stat{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:4px;
    padding:12px 14px;
  }
  .stat .label{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .stat .value{
    font-family:'Fraunces', serif;
    font-size:20px;
    font-weight:600;
  }
  .stat.income .value{color:var(--moss);}
  .stat.expense .value{color:var(--clay);}
  .stat.net{grid-column:1 / -1;}
  .stat.net .value{font-size:24px;}

  .section-title{
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin:22px 0 10px;
  }
  .section-title:first-child{margin-top:0;}

  .goal-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px;
    margin-bottom:10px;
  }
  .goal-card .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .goal-card .row h3{
    font-size:14px;
    font-weight:600;
    font-family:'Inter',sans-serif;
  }
  .goal-card .dev{
    font-size:13px;
    font-weight:600;
    font-family:'Fraunces', serif;
  }
  .goal-card .dev.over{color:var(--moss);}
  .goal-card .dev.under{color:var(--clay);}
  .goal-bar-track{
    height:6px;
    background:var(--line);
    border-radius:3px;
    overflow:hidden;
    margin-bottom:6px;
  }
  .goal-bar-fill{
    height:100%;
    background:var(--moss);
    border-radius:3px;
    transition:width .4s ease;
  }
  .goal-meta{
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
  }
  .goal-edit{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .goal-edit input{
    flex:1;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    font-family:'Inter',sans-serif;
  }
  .goal-edit button{
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:4px;
    padding:8px 12px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }

  .debt-card{
    background:var(--debt-card-bg);
    color:var(--debt-card-fg);
    border-radius:6px;
    padding:14px 16px 13px;
    margin-bottom:12px;

  .debt-card.weekly{

  .debt-card .row{

    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;

  }
  .debt-card .row h3{
    font-size:14px;
    font-weight:500;
    font-family:'Inter',sans-serif;
    color:var(--brass-soft);
  }
  .debt-card .badge{

    background:var(--brass);

    border-radius:10px;
    font-weight:700;

  }
  .debt-card .amount{

    font-size:20px;
    font-weight:600;

  .debt-bar-track{
    height:7px;
    background:rgba(255,255,255,0.15);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:8px;
  }
  .debt-bar-fill{

    background:var(--brass);
    border-radius:4px;

  .debt-meta{

  .debt-actions{

  .debt-actions button{

  .add-debt-card{

  .add-debt-card .form-row{

  .add-debt-card input{

  .add-debt-card .name-input{flex:1.4;}
  .add-debt-card .amt-input{flex:1;}
  .checkbox-row{

    gap:6px;

    color:var(--ink-soft);

  .add-debt-card .add-btn{

    padding:9px;
    border:none;
    border-radius:4px;
    background:var(--brass);
    color:var(--navy);
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }

  .tabs{
    display:flex;
    border-bottom:1px solid var(--line);
    margin-bottom:16px;
  }
  .tab{

    text-align:center;

    font-size:12.5px;
    font-weight:500;
    color:var(--ink-soft);

    border-bottom:2px solid transparent;

  .panel{display:none;}

  .form-row{

  .form-row:last-child{margin-bottom:0;}
  .form-card input, .form-card select{

    font-size:14px;
    padding:9px 10px;
    border:1px solid var(--line);

  .form-card input[type="date"]{flex:1.6;}
  .form-card select{flex:1.4;}
  .form-card .note-row input{width:100%;}
  .add-btn{
    width:100%;
    padding:10px;
    border:none;
    border-radius:4px;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;

    margin-top:2px;
  }
  .add-btn.income-btn{background:var(--moss);}
  .add-btn.expense-btn{background:var(--clay);}

  .cap-note{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:8px;
    display:flex;
    justify-content:space-between;
  }
  .cap-note.over{color:var(--clay);font-weight:600;}

  .entry-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .entry{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 2px;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .entry .left{flex:1;min-width:0;}
  .entry .cat{

  }
  .entry .note{
    font-size:12px;
    color:var(--ink-soft);

  }
  .entry .right{
    display:flex;

  }
  .entry .amt{
    font-family:'Fraunces', serif;

  }
  .entry.income .amt{color:var(--moss);}
  .entry.expense .amt{color:var(--clay);}
  .entry .del{

    border:none;
    color:var(--ink-soft);
    font-size:16px;
    cursor:pointer;

  .empty{

  .cat-breakdown{

  .cat-breakdown h3{
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    text-transform:none;

  }
  .cat-bar-row{
    margin-bottom:8px;
  }
  .cat-bar-label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-bottom:3px;
  }
  .cat-bar-track{
    height:5px;
    background:var(--line);
    border-radius:3px;
    overflow:hidden;
  }
  .cat-bar-fill{
    height:100%;
    background:var(--clay);
    border-radius:3px;
  }
  .cat-bar-fill.inc{background:var(--moss);}

  .loading{
    text-align:center;
    padding:60px 10px;
    color:var(--ink-soft);
    font-size:13px;
  }

  .backup-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px;
    margin-top:22px;
  }
  .backup-card p{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 12px;
    line-height:1.5;
  }
  .backup-row{
    display:flex;
    gap:8px;
  }
  .backup-row button, .backup-row label{
    flex:1;
    text-align:center;
    padding:10px;
    border-radius:4px;
    font-size:13px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
    display:block;
  }
  .backup-row input[type="file"]{display:none;}
  .backup-status{
    font-size:12px;
    margin-top:8px;
    text-align:center;
    color:var(--moss);
    min-height:16px;
  }
  .backup-status.error{color:var(--clay);}

  .cash-note{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:6px;
  }

  .search-row input{
    background:var(--paper-raised);
  }

  .templates-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:14px;
  }
  .template-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .template-row:last-of-type{border-bottom:none;}
  .tpl-info{flex:1;min-width:0;}
  .tpl-name{font-weight:500;font-size:13.5px;}
  .tpl-meta{font-size:11.5px;color:var(--ink-soft);}
  .tpl-log-btn{
    background:var(--moss);
    color:#fff;
    border:none;
    border-radius:4px;
    padding:6px 10px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    white-space:nowrap;
  }

  .period-switch{
    display:flex;
    gap:6px;
    margin-bottom:10px;
  }
  .period-btn{
    flex:1;
    padding:8px;
    border-radius:4px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    font-size:13px;
    font-weight:500;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .period-btn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .period-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    font-weight:600;
    font-family:'Fraunces',serif;
  }
  .period-nav button{
    background:none;
    border:1px solid var(--line);
    border-radius:4px;

    height:32px;
    font-size:15px;
    cursor:pointer;

  .pie-wrap{

    gap:16px;

  .pie-legend{flex:1;min-width:0;}
  .pie-legend-row{

  .pie-dot{
    width:9px;height:9px;border-radius:50%;flex-shrink:0;

  .pie-legend-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pie-legend-val{color:var(--ink-soft);}

  .debt-week-goal{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.12);}
  .debt-week-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    color:rgba(255,255,255,0.75);

  }
  .debt-warn{
    color:var(--clay-soft);
    font-weight:600;
    font-size:11px;
  }
  .debt-week-goal .goal-edit input{
    background:rgba(255,255,255,0.08);
    border-color:rgba(255,255,255,0.2);

  }
  .debt-forecast{
    font-size:11.5px;
    color:rgba(255,255,255,0.6);
    margin-top:8px;

  .budgets-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:14px;

  .budget-row{

    border-bottom:1px solid var(--line);

  .budget-row:last-child{border-bottom:none;}
  .budget-top{

  .pending-card input, .pending-card select{

    font-size:14px;

  .pending-card .form-row input[type="date"]{flex:1.3;}

    font-size:11.5px;

<body>
<div class="app" id="app">
  <div class="loading" id="loading">Открываем гроссбух…</div>
</div>

<script>
const INCOME_CATS = ["Зарплата","Ночная подработка","Чаевые","Продажа вещей","Подарки","Другое"];
const EXPENSE_CATS = ["Обязательные","Долг","Продукты","Кафе-фастфуд","Обслуживание техники","Транспорт","Здоровье","Одежда и обувь","Развлечения","Другое","Спонтанные"];

let state = {
  entries: [],         // {id, type, amount, category, note, date, debtId, method}
  debts: [],           // {id, name, goal, paid, weekly, weeklyGoal}
  goals: { weekAmount: 0, monthAmount: 0 },
  categoryCaps: {},    // { "Спонтанные": 5000, ... }
  templates: [],       // {id, name, amount, category}
  pending: [],         // {id, hours, orders, amount, note, date} — ожидаемые, но ещё не пришедшие начисления
  payRates: { hourly: 176, perOrder: 96 }
};

let activeTab = 'income';
let editingEntryId = null;
let overviewPeriod = 'month';
let overviewOffset = 0;
let incomeSearch = '';
let expenseSearch = '';
let currentTheme = 'light';

function loadTheme(){
  try{
    const saved = localStorage.getItem('money-ledger-theme');
    if(saved === 'dark') currentTheme = 'dark';
  }catch(e){}
  document.documentElement.setAttribute('data-theme', currentTheme);
}

function makeTransfer(){
  const amountEl = document.getElementById('transfer-amount');
  const dirEl = document.getElementById('transfer-direction');
  const dateEl = document.getElementById('transfer-date');
  const noteEl = document.getElementById('transfer-note');
  const amount = parseFloat(amountEl.value);
  if(!amount || amount <= 0){
    amountEl.focus();
    return;
  }
  const dir = dirEl.value; // 'card-to-cash' or 'cash-to-card'
  const dateVal = dateEl && dateEl.value ? dateEl.value : todayISODate();
  const note = noteEl.value.trim();
  const fromMethod = dir === 'card-to-cash' ? 'card' : 'cash';
  const toMethod = dir === 'card-to-cash' ? 'cash' : 'card';
  const baseId = Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  state.entries.unshift({
    id: baseId+'a',
    type: 'transfer',
    direction: 'out',
    amount,
    category: 'Перевод',
    note,

const monthNames = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const weekdayNamesShort = ["вс","пн","вт","ср","чт","пт","сб"];

function fmt(n){
  return Math.round(n).toLocaleString('ru-RU') + ' ₽';
}

function todayISODate(){
  const n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
}

function isThisMonth(dateStr){
  const d = new Date(dateStr);
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
}

function getWeekRange(){
  const now = new Date();
  const day = now.getDay() === 0 ? 7 : now.getDay(); // Monday=1..Sunday=7
  const monday = new Date(now);
  monday.setHours(0,0,0,0);
  monday.setDate(now.getDate() - (day - 1));
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  sunday.setHours(23,59,59,999);
  return {monday, sunday};
}

function isThisWeek(dateStr){
  const d = new Date(dateStr);
  const {monday, sunday} = getWeekRange();
  return d >= monday && d <= sunday;
}

function getPeriodRange(period, offset){
  if(period === 'day'){
    const start = new Date();
    start.setDate(start.getDate() + offset);
    start.setHours(0,0,0,0);
    const end = new Date(start);
    end.setHours(23,59,59,999);
    const label = weekdayNamesShort[start.getDay()] + ', ' + start.getDate() + ' ' + monthNames[start.getMonth()];
    return {start, end, label};
  }
  if(period === 'week'){
    const {monday} = getWeekRange();
    const start = new Date(monday);
    start.setDate(start.getDate() + offset*7);
    const end = new Date(start);
    end.setDate(start.getDate()+6);
    end.setHours(23,59,59,999);
    const label = start.getDate() + '–' + end.getDate() + ' ' + monthNames[end.getMonth()];
    return {start, end, label};
  }
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth()+offset, 1);
  const end = new Date(now.getFullYear(), now.getMonth()+offset+1, 0, 23,59,59,999);
  const label = monthNames[start.getMonth()] + ' ' + start.getFullYear();
  return {start, end, label};
}

function entriesInRange(start, end){
  return state.entries.filter(e => { const d = new Date(e.date); return d >= start && d <= end; });
}

function entrySign(e){
  if(e.type === 'income') return 1;
  if(e.type === 'expense') return -1;
  if(e.type === 'transfer') return e.direction === 'in' ? 1 : -1;
  return 0;
}

function cashBalance(){
  return state.entries.filter(e => e.method === 'cash')
    .reduce((s,e) => s + entrySign(e)*e.amount, 0);
}

function cardBalance(){
  return state.entries.filter(e => e.method === 'card' || !e.method)
    .reduce((s,e) => s + entrySign(e)*e.amount, 0);
}

function computeDebtForecast(debt){
  const remaining = Math.max(0, debt.goal - debt.paid);
  if(remaining <= 0) return null;
  const since = new Date();
  since.setDate(since.getDate()-28);
  const recent = state.entries.filter(e => e.debtId === debt.id && new Date(e.date) >= since);
  const paidRecent = recent.reduce((s,e)=>s+e.amount,0);
  const avgWeekly = paidRecent / 4;
  if(avgWeekly <= 0) return null;
  const weeksLeft = Math.ceil(remaining / avgWeekly);
  const date = new Date();
  date.setDate(date.getDate() + weeksLeft*7);
  return { avgWeekly, date };
}

const hasCloudStorage = typeof window.storage !== 'undefined' && window.storage !== null;
const LOCAL_KEY = 'money-ledger-state-v1';

async function loadState(){
  try{
    let raw = null;
    if(hasCloudStorage){
      const res = await window.storage.get('ledger-state', false);
      if(res && res.value) raw = res.value;
    } else {
      raw = localStorage.getItem(LOCAL_KEY);
    }
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
      if(!state.debts) state.debts = [];
      if(!state.goals) state.goals = { weekAmount: 0, monthAmount: 0 };
      if(!state.categoryCaps) state.categoryCaps = {};
      if(!state.templates) state.templates = [];
      if(!state.pending) state.pending = [];
      if(!state.payRates) state.payRates = { hourly: 176, perOrder: 96 };
      if(parsed.spontaneousCap && !state.categoryCaps['Спонтанные']){
        state.categoryCaps['Спонтанные'] = parsed.spontaneousCap;
      }
      state.entries.forEach(e => { if(!e.method) e.method = 'card'; });
    }
  }catch(e){
    console.log('No existing state, starting fresh', e);
  }
  render();
}

async function saveState(){
  try{
    const payload = JSON.stringify(state);
    if(hasCloudStorage){
      await window.storage.set('ledger-state', payload, false);
    } else {
      localStorage.setItem(LOCAL_KEY, payload);
    }
  }catch(e){
    console.error('Save failed', e);
  }
}

function addEntry(type){
  const amountEl = document.getElementById(type+'-amount');
  const catEl = document.getElementById(type+'-cat');
  const noteEl = document.getElementById(type+'-note');
  const dateEl = document.getElementById(type+'-date');
  const methodEl = document.getElementById(type+'-method');
  const amount = parseFloat(amountEl.value);
  if(!amount || amount <= 0){
    amountEl.focus();
    return;
  }
  let debtId = null;
  if(type === 'expense' && catEl.value === 'Долг'){
    const debtSel = document.getElementById('expense-debt-select');
    if(debtSel && debtSel.value) debtId = debtSel.value;
  }
  const dateVal = dateEl && dateEl.value ? dateEl.value : todayISODate();
  state.entries.unshift({
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    type,
    amount,
    category: catEl.value,
    note: noteEl.value.trim(),
    date: new Date(dateVal+'T12:00:00').toISOString(),
    debtId,
    method: methodEl && methodEl.value === 'cash' ? 'cash' : 'card'
  });
  if(debtId){
    const debt = state.debts.find(d => d.id === debtId);
    if(debt) debt.paid = (debt.paid||0) + amount;
  }
  amountEl.value = '';
  noteEl.value = '';
  saveState();
  render();
}

function deleteEntry(id){
  const entry = state.entries.find(e => e.id === id);
  if(entry && entry.debtId){
    const debt = state.debts.find(d => d.id === entry.debtId);
    if(debt) debt.paid = Math.max(0, (debt.paid||0) - entry.amount);
  }
  const idsToRemove = [id];
  if(entry && entry.type === 'transfer' && entry.linkId) idsToRemove.push(entry.linkId);
  state.entries = state.entries.filter(e => !idsToRemove.includes(e.id));
  saveState();
  render();
}

function saveEntryEdit(id){
  const entry = state.entries.find(e => e.id === id);
  if(!entry) return;
  const amount = parseFloat(document.getElementById('edit-amount-'+id).value);
  const dateVal = document.getElementById('edit-date-'+id).value || todayISODate();
  const cat = document.getElementById('edit-cat-'+id).value;
  const note = document.getElementById('edit-note-'+id).value.trim();
  const debtSel = document.getElementById('edit-debt-'+id);
  const newDebtId = (entry.type==='expense' && cat==='Долг' && debtSel && debtSel.value) ? debtSel.value : null;
  if(!amount || amount <= 0) return;

  // отвязываем старый вклад в долг
  if(entry.debtId){
    const oldDebt = state.debts.find(d => d.id === entry.debtId);
    if(oldDebt) oldDebt.paid = Math.max(0, (oldDebt.paid||0) - entry.amount);
  }
  // привязываем новый
  if(newDebtId){
    const newDebt = state.debts.find(d => d.id === newDebtId);
    if(newDebt) newDebt.paid = (newDebt.paid||0) + amount;
  }

  entry.amount = amount;
  entry.date = new Date(dateVal+'T12:00:00').toISOString();
  entry.category = cat;
  entry.note = note;
  entry.debtId = newDebtId;

  editingEntryId = null;
  saveState();
  render();
}

        <button class="add-btn" style="background:var(--brass);" onclick="addPending()">Добавить в ожидание</button>
        ${state.pending.length > 0 ? `<button class="clear-pending-btn" onclick="clearAllPending()">Зарплата пришла — очистить список</button>` : ''}
      </div>

      <div class="section-title">Перевод карта ↔ нал</div>
      <div class="pending-card">
        <div class="form-row">
          <input type="number" id="transfer-amount" placeholder="Сумма, ₽" value="${transferAmountVal}">
          <select id="transfer-direction" onchange="render()">
            <option value="card-to-cash" ${transferDirVal==='card-to-cash'?'selected':''}>С карты в нал</option>
            <option value="cash-to-card" ${transferDirVal==='cash-to-card'?'selected':''}>С нала на карту</option>
          </select>
        </div>
        <div class="form-row">
          <input type="date" id="transfer-date" value="${transferDateVal}">
          <input type="text" id="transfer-note" placeholder="Заметка (напр. квартплата)" value="${transferNoteVal}">
        </div>
        <button class="add-btn" style="background:var(--navy);color:var(--paper);" onclick="makeTransfer()">Перевести</button>
        ${recentTransfers.length > 0 ? `
        <div class="transfer-list">
          ${recentTransfers.slice(0,5).map(t => {
            const td = new Date(t.date);
            const dirLabel = t.method === 'card' ? 'Карта → Нал' : 'Нал → Карта';
            return `<div class="pending-row">
              <div class="pending-info">
                <div class="pending-amt">${fmt(t.amount)}</div>
                <div class="pending-note">${dirLabel}${t.note ? ' · ' + t.note : ''} · ${td.getDate()} ${monthNames[td.getMonth()].slice(0,3)}</div>
              </div>
              <button class="del" onclick="deleteEntry('${t.id}')">✕</button>
            </div>`;
          }).join('')}
        </div>` : ''}
      </div>

      <div class="form-row search-row">
        <input type="text" id="income-search" placeholder="Поиск по заметке…" value="${incomeSearch}" oninput="onIncomeSearch()">
      </div>
      ${renderEntryList(allEntriesSorted.filter(e=>e.type==='income'), incomeSearch, 'income')}
    </div>

    <div class="panel${activeTab==='expense'?' active':''}" id="panel-expense">
      <div class="form-card">
        <div class="form-row">
          <input type="number" id="expense-amount" placeholder="Сумма, ₽" inputmode="decimal" value="${expenseAmountVal}">
          <select id="expense-cat" onchange="onExpenseCatChange()">${EXPENSE_CATS.map(c=>`<option value="${c}" ${c===expenseCatSelected?'selected':''}>${c}</option>`).join('')}</select>
        </div>
        <div class="form-row">
          <input type="date" id="expense-date" value="${expenseDateVal}">
          <select id="expense-method">
            <option value="card" ${expenseMethodVal==='card'?'selected':''}>Карта</option>
            <option value="cash" ${expenseMethodVal==='cash'?'selected':''}>Нал</option>
          </select>
        </div>
        ${expenseCatSelected === 'Долг' ? `
        <div class="form-row">
          <select id="expense-debt-select" style="width:100%;">
            ${state.debts.length === 0 ? `<option value="">Сначала добавь долг во вкладке «Цели и долги»</option>` :
              state.debts.map(d => `<option value="${d.id}">${d.name} (осталось ${fmt(Math.max(0,d.goal-d.paid))})</option>`).join('')}
          </select>
        </div>` : ''}
        <div class="form-row note-row">
          <input type="text" id="expense-note" placeholder="Заметка (необязательно)" value="${expenseNoteVal}">
        </div>
        <button class="add-btn expense-btn" onclick="addEntry('expense')">Записать расход</button>
      </div>

      <div class="section-title">Постоянные расходы</div>
      <div class="templates-card">
        ${state.templates.length === 0 ? `<div class="empty">Пока нет шаблонов — добавь ниже (напр. связь, VPN, вода)</div>` :
          state.templates.map(t => `
          <div class="template-row">
            <div class="tpl-info">
              <div class="tpl-name">${t.name}</div>
              <div class="tpl-meta">${t.category} · ${fmt(t.amount)}</div>
            </div>
            <button class="tpl-log-btn" onclick="logTemplate('${t.id}')">Записать</button>
            <button class="del" onclick="deleteTemplate('${t.id}')">✕</button>
          </div>`).join('')}
        <div class="form-row" style="margin-top:10px;">
          <input type="text" id="tpl-name" placeholder="Название (напр. VPN)">
          <input type="number" id="tpl-amount" placeholder="Сумма, ₽">
        </div>
        <div class="form-row">
          <select id="tpl-cat" style="width:100%;">${EXPENSE_CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        </div>
        <button class="add-btn" style="background:var(--ink-soft);" onclick="addTemplate()">Добавить шаблон</button>
      </div>

      <div class="form-row search-row" style="margin-top:16px;">
        <input type="text" id="expense-search" placeholder="Поиск по заметке…" value="${expenseSearch}" oninput="onExpenseSearch()">
      </div>
      ${renderEntryList(allEntriesSorted.filter(e=>e.type==='expense'), expenseSearch, 'expense')}
    </div>

    <div class="panel${activeTab==='goals'?' active':''}" id="panel-goals">
      <div class="section-title">Цель по доходу — неделя (${weekLabel})</div>
      ${renderIncomeGoal(weekIncome, state.goals.weekAmount, 'week-goal-input', 'setWeekGoal')}

      <div class="section-title">Цель по доходу — месяц</div>
      ${renderIncomeGoal(income, state.goals.monthAmount, 'month-goal-input', 'setMonthGoal')}

      <div class="section-title">Долги</div>
      ${state.debts.length === 0 ? '' : state.debts.map(renderDebtCard).join('')}
      <div class="add-debt-card">
        <div class="form-row">
          <input class="name-input" type="text" id="new-debt-name" placeholder="Название (напр. Т-Банк кубышка)">
          <input class="amt-input" type="number" id="new-debt-amount" placeholder="Сумма, ₽">
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="new-debt-weekly">
          Хочу закрыть на этой неделе
        </label>
        <button class="add-btn" onclick="addDebt()">Добавить долг</button>
      </div>
    </div>

    <div class="panel${activeTab==='overview'?' active':''}" id="panel-overview">
      <div class="period-switch">
        <button class="period-btn ${overviewPeriod==='day'?'active':''}" onclick="setOverviewPeriod('day')">День</button>
        <button class="period-btn ${overviewPeriod==='week'?'active':''}" onclick="setOverviewPeriod('week')">Неделя</button>
        <button class="period-btn ${overviewPeriod==='month'?'active':''}" onclick="setOverviewPeriod('month')">Месяц</button>
      </div>
      <div class="period-nav">
        <button onclick="shiftOverview(-1)">←</button>
        <span>${periodLabel}</span>
        <button onclick="shiftOverview(1)" ${overviewOffset>=0?'disabled':''}>→</button>
      </div>

      <div class="summary" style="margin-top:12px;">
        <div class="stat income"><div class="label">Доход за период</div><div class="value">${fmt(periodIncome)}</div></div>
        <div class="stat expense"><div class="label">Расход за период</div><div class="value">${fmt(periodExpense)}</div></div>
      </div>

      <div class="cat-breakdown">
        <h3>Куда уходит</h3>
        ${renderPieChart(periodExpenseCatTotals)}
        ${renderBars(periodExpenseCatTotals, periodExpense, '')}
      </div>
      <div class="cat-breakdown">
        <h3>Откуда доход</h3>
        ${renderBars(periodIncomeCatTotals, periodIncome, 'inc')}
      </div>

      <div class="section-title">Бюджеты по категориям (необязательно)</div>
      <div class="budgets-card">
        ${EXPENSE_CATS.map(cat => {
          const capVal = state.categoryCaps[cat] || 0;
          const spent = expenseCatTotals[cat] || 0;
          return `<div class="budget-row">
            <div class="budget-top">
              <span>${cat}</span>
              ${capVal ? `<span class="${spent>capVal?'over':''}">${fmt(spent)} / ${fmt(capVal)}</span>` : ''}
            </div>
            <div class="goal-edit">
              <input type="number" id="cap-input-${cat}" placeholder="Лимит, ₽" value="${capVal||''}">
              <button onclick="setCategoryCap('${cat}')">Задать</button>
            </div>
          </div>`;
        }).join('')}
      </div>

      <div class="backup-card">
        <p>Вся база (доходы, расходы, долги, цели) — в один файл. Сохрани его куда угодно: в облако, на флешку, отправь себе. Если что-то случится с кэшем браузера, загрузишь этот файл обратно и всё восстановится.</p>
        <div class="backup-row">
          <button onclick="exportData()">Скачать бэкап</button>
          <label for="import-file">Загрузить бэкап</label>
          <input type="file" id="import-file" accept="application/json" onchange="importData(event)">
        </div>
        <div class="backup-status" id="backup-status"></div>
      </div>
    </div>
  `;

  if(focusedId){
    const el = document.getElementById(focusedId);
    if(el){
      el.focus();
      if(focusedSel !== null && el.setSelectionRange){
        try{ el.setSelectionRange(focusedSel, focusedSel); }catch(e){}
      }
    }
  }
}

function renderIncomeGoal(actual, target, inputId, fnName){
  const pct = target > 0 ? Math.min(100, Math.round((actual/target)*100)) : 0;
  const diff = actual - target;
  const devClass = diff >= 0 ? 'over' : 'under';
  const devText = target > 0
    ? (diff >= 0 ? `+${fmt(diff)} к цели` : `${fmt(diff)} до цели`)
    : '';
  return `
    <div class="goal-card">
      <div class="row">
        <h3>${fmt(actual)}${target > 0 ? ' / ' + fmt(target) : ''}</h3>
        ${target > 0 ? `<span class="dev ${devClass}">${devText}</span>` : ''}
      </div>
      ${target > 0 ? `<div class="goal-bar-track"><div class="goal-bar-fill" style="width:${pct}%"></div></div>
      <div class="goal-meta"><span>Выполнено</span><span>${pct}%</span></div>` : ''}
      <div class="goal-edit">
        <input type="number" id="${inputId}" placeholder="Цель, ₽" value="${target||''}">
        <button onclick="${fnName}()">Задать</button>
      </div>
    </div>
  `;
}

function renderDebtCard(debt){
  const remaining = Math.max(0, debt.goal - debt.paid);
  const pct = debt.goal > 0 ? Math.min(100, Math.round((debt.paid/debt.goal)*100)) : 0;
  const weekPaid = state.entries.filter(e => e.debtId === debt.id && isThisWeek(e.date)).reduce((s,e)=>s+e.amount,0);
  const forecast = remaining > 0 ? computeDebtForecast(debt) : null;
  const behindPace = debt.weeklyGoal > 0 && weekPaid < debt.weeklyGoal;
  return `
    <div class="debt-card ${debt.weekly ? 'weekly' : ''}">
      <div class="row">
        <h3>${debt.name}</h3>
        ${debt.weekly ? '<span class="badge">На этой неделе</span>' : ''}
      </div>
      <div class="amount">${fmt(remaining)}</div>
      <div class="debt-bar-track"><div class="debt-bar-fill" style="width:${pct}%"></div></div>
      <div class="debt-meta">
        <span>Погашено: ${fmt(debt.paid)} из ${fmt(debt.goal)}</span>
        <span>${pct}%</span>
      </div>
      ${remaining > 0 ? `
      <div class="debt-week-goal">
        <div class="debt-week-row">
          <span>На этой неделе: ${fmt(weekPaid)}${debt.weeklyGoal > 0 ? ' / ' + fmt(debt.weeklyGoal) : ''}</span>
          ${behindPace ? '<span class="debt-warn">отстаём от темпа</span>' : ''}
        </div>
        <div class="goal-edit">
          <input type="number" id="debt-weekly-input-${debt.id}" placeholder="Цель на неделю, ₽" value="${debt.weeklyGoal||''}">
          <button onclick="setDebtWeeklyGoal('${debt.id}')">Задать</button>
        </div>
      </div>
      ${forecast ? `<div class="debt-forecast">При темпе ~${fmt(forecast.avgWeekly)}/нед закроешь примерно к ${forecast.date.getDate()} ${monthNames[forecast.date.getMonth()]}</div>` : ''}
      ` : ''}
      <div class="debt-actions">
        ${remaining > 0 ? `<button onclick="markDebtDone('${debt.id}')">Отметить закрытым</button>` : ''}
        <button class="del" onclick="deleteDebt('${debt.id}')">Удалить</button>
      </div>
    </div>
  `;
}

function renderBars(totals, sum, cls){
  const entries = Object.entries(totals).filter(([,v]) => v > 0);
  if(entries.length === 0) return `<div class="empty">Пока пусто</div>`;
  return entries.sort((a,b)=>b[1]-a[1]).map(([cat,val]) => {
    const pct = sum > 0 ? Math.round((val/sum)*100) : 0;
    return `<div class="cat-bar-row">
      <div class="cat-bar-label"><span>${cat}</span><span>${fmt(val)} · ${pct}%</span></div>
      <div class="cat-bar-track"><div class="cat-bar-fill ${cls}" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

const PIE_COLORS = ['#A9573F','#A9793B','#5F7A5A','#2C3A4F','#8B6F47','#6B4C3A','#4A5D23','#7A5C7E'];

function renderPieChart(totals){
  const data = Object.entries(totals).filter(([,v]) => v > 0).sort((a,b)=>b[1]-a[1]);
  if(data.length === 0) return '';
  const sum = data.reduce((s,[,v])=>s+v,0);
  const r = 52, cx = 70, cy = 70, circumference = 2*Math.PI*r;
  let offset = 0;
  const segments = data.map(([cat,val], i) => {
    const len = (val/sum)*circumference;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${PIE_COLORS[i%PIE_COLORS.length]}" stroke-width="22" stroke-dasharray="${len} ${circumference-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
    offset += len;
    return seg;
  }).join('');
  const legend = data.map(([cat,val], i) => `
    <div class="pie-legend-row">
      <span class="pie-dot" style="background:${PIE_COLORS[i%PIE_COLORS.length]}"></span>
      <span class="pie-legend-label">${cat}</span>
      <span class="pie-legend-val">${Math.round(val/sum*100)}%</span>
    </div>`).join('');
  return `<div class="pie-wrap"><svg viewBox="0 0 140 140" width="140" height="140">${segments}</svg><div class="pie-legend">${legend}</div></div>`;
}

function renderEntryList(list, searchQ, kind){
  const filtered = searchQ ? list.filter(e => (e.note||'').toLowerCase().includes(searchQ.toLowerCase()) || e.category.toLowerCase().includes(searchQ.toLowerCase())) : list;
  if(filtered.length === 0) return `<div class="empty">${searchQ ? 'Ничего не найдено' : 'Записей пока нет'}</div>`;
  const cats = kind === 'income' ? INCOME_CATS : EXPENSE_CATS;
  return `<ul class="entry-list">${filtered.map(e => {
    if(editingEntryId === e.id){
      const editCatEl = document.getElementById('edit-cat-'+e.id);
      const editCatNow = editCatEl ? editCatEl.value : e.category;
      return `<li class="entry edit-row">
        <div class="form-row">
          <input type="number" id="edit-amount-${e.id}" value="${e.amount}" inputmode="decimal">
          <select id="edit-cat-${e.id}" ${kind==='expense' ? `onchange="render()"` : ''}>${cats.map(c=>`<option value="${c}" ${c===editCatNow?'selected':''}>${c}</option>`).join('')}</select>
        </div>
        <div class="form-row">
          <input type="date" id="edit-date-${e.id}" value="${e.date.slice(0,10)}">
        </div>
        ${kind==='expense' && editCatNow==='Долг' ? `
        <div class="form-row">
          <select id="edit-debt-${e.id}" style="width:100%;">
            ${state.debts.map(d => `<option value="${d.id}" ${e.debtId===d.id?'selected':''}>${d.name}</option>`).join('')}
          </select>
        </div>` : ''}
        <div class="form-row note-row">
          <input type="text" id="edit-note-${e.id}" value="${(e.note||'').replace(/"/g,'&quot;')}" placeholder="Заметка">
        </div>
        <div class="form-row">
          <button class="add-btn" style="background:var(--moss);" onclick="saveEntryEdit('${e.id}')">Сохранить</button>
          <button class="add-btn" style="background:var(--ink-soft);" onclick="cancelEditEntry()">Отмена</button>
        </div>
      </li>`;
    }
    const d = new Date(e.date);
    const dateStr = d.getDate() + ' ' + monthNames[d.getMonth()].slice(0,3);
    const debtName = e.debtId ? (state.debts.find(x=>x.id===e.debtId)||{}).name : null;
    return `<li class="entry ${e.type}">
      <div class="left">
        <div class="cat">${e.category}${debtName ? ' · ' + debtName : ''}${e.method==='cash' ? ' · нал' : ''}</div>
        <div class="note">${e.note ? e.note + ' · ' : ''}${dateStr}</div>
      </div>
      <div class="right">
        <span class="amt">${e.type==='income'?'+':'−'}${fmt(e.amount)}</span>
        <button class="del" onclick="startEditEntry('${e.id}')">✎</button>
        <button class="del" onclick="deleteEntry('${e.id}')">✕</button>
      </div>
    </li>`;
  }).join('')}</ul>`;
}

function exportData(){
  const payload = {
    exportedAt: new Date().toISOString(),
    state
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `бабки-менеджмент-бэкап-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  const statusEl = document.getElementById('backup-status');
  if(statusEl){
    statusEl.textContent = 'Файл скачан';
    statusEl.classList.remove('error');
  }
}

function importData(event){
  const file = event.target.files[0];
  const statusEl = document.getElementById('backup-status');
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      const incoming = parsed.state || parsed; // support raw state or wrapped export
      if(!incoming || !Array.isArray(incoming.entries)){
        throw new Error('Неверный формат файла');
      }
      state = Object.assign({entries:[], debts:[], goals:{weekAmount:0, monthAmount:0}, categoryCaps:{}, templates:[], pending:[], payRates:{hourly:176, perOrder:96}}, incoming);
      if(!state.categoryCaps) state.categoryCaps = {};
      if(!state.templates) state.templates = [];
      if(!state.pending) state.pending = [];
      if(!state.payRates) state.payRates = { hourly: 176, perOrder: 96 };
      if(incoming.spontaneousCap && !state.categoryCaps['Спонтанные']){
        state.categoryCaps['Спонтанные'] = incoming.spontaneousCap;
      }
      state.entries.forEach(e => { if(!e.method) e.method = 'card'; });
      editingEntryId = null;
      saveState();
      render();
      const s = document.getElementById('backup-status');
      if(s){
        s.textContent = 'База восстановлена из файла';
        s.classList.remove('error');
      }
    }catch(err){
      if(statusEl){
        statusEl.textContent = 'Не удалось прочитать файл — проверь, что это тот самый бэкап';
        statusEl.classList.add('error');
      }
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

loadTheme();
loadState();
</script>
